<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>maiGoLLMRouter — Logs</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8a93a6; --accent: #6ea8fe; --ok: #3fb950; --err: #f85149; --warn: #d29922;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 13px; }
  input, button, select { background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  button { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
  button:hover { border-color: var(--accent); }
  /* #refresh glows while auto-refresh is on (toggled by holding the button). */
  @keyframes refreshGlow {
    0%, 100% { box-shadow: 0 0 5px rgba(110,168,254,.45); }
    50%      { box-shadow: 0 0 13px rgba(110,168,254,.85); }
  }
  #refresh.glow { border-color: var(--accent); color: var(--accent);
    animation: refreshGlow 1.6s ease-in-out infinite; }
  .wrap { padding: 16px 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 53px; background: var(--bg); }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--panel); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .pill.err { background: rgba(248,81,73,.15); color: var(--err); }
  .pill.active { background: rgba(110,168,254,.15); color: var(--accent); }
  tr.inflight { background: rgba(110,168,254,.04); }
  tr.inflight:hover { background: rgba(110,168,254,.08); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .detail td { background: var(--panel); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono);
    font-size: 12px; max-height: 360px; overflow: auto; }
  pre.nowrap { white-space: pre; word-break: normal; }
  .attempts { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); }
  .attempt { display: grid; grid-template-columns: 1fr 1fr 90px 110px 90px 90px;
    gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
  .attempt .k { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--border); }
  .o-success { color: var(--ok); } .o-bad_output, .o-provider_error, .o-error { color: var(--err); }
  .o-skipped_blackout, .o-canceled { color: var(--muted); }
  .o-prohibited_content { color: var(--warn); }
  .o-incompatible { color: var(--warn); }
  .attempt-resp { margin: -2px 0 8px; }
  .attempt-resp > summary { cursor: pointer; color: var(--err); font-size: 11px; user-select: none; }
  .attempt-resp > summary:hover { color: var(--accent); }
  .attempt-resp > pre { margin-top: 6px; max-height: 220px; }
</style>
</head>
<body>
<header>
  <h1>maiGoLLMRouter</h1>
  <span class="muted" style="font-size:13px">request logs</span>
  <span id="inflight-count" class="badge" style="display:none;color:var(--accent)"></span>
  <div class="spacer"></div>
  <input id="f-model" type="search" placeholder="Filter by model (min 3 chars)…" autocomplete="off"
    title="Match inbound model or served provider/model (comma = OR); needs at least 3 characters" style="width:220px" />
  <select id="f-time" title="Time range">
    <option value="1d" selected>Last 24 hours</option>
    <option value="7d">Last 7 days</option>
    <option value="30d">Last 30 days</option>
    <option value="all">All time</option>
  </select>
  <select id="f-status" title="Filter by outcome">
    <option value="all">All status</option>
    <option value="success">Success (2xx)</option>
    <option value="error">Errors</option>
  </select>
  <select id="f-endpoint" title="Filter by endpoint">
    <option value="all">All endpoints</option>
  </select>
  <button id="f-clear" title="Clear all filters">Clear</button>
  <button id="refresh" title="Click to refresh now · hold to toggle auto-refresh">Refresh</button>
</header>
<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>Time</th><th>Status</th><th>Endpoint</th><th>Inbound model</th><th>Request</th>
        <th>Served by</th><th>Attempts</th><th>In tokens</th><th>Out tokens</th><th>Finish</th><th>Latency</th>
      </tr>
    </thead>
    <tbody id="inflight-rows"></tbody>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">No log entries yet.</div>
</div>

<script>
const rowsEl = document.getElementById('rows');
const inflightRowsEl = document.getElementById('inflight-rows');
const inflightCountEl = document.getElementById('inflight-count');
const emptyEl = document.getElementById('empty');
let timer = null;
let autoOn = false;                // auto-refresh state (toggled by holding Refresh)
const expanded = new Set();        // paths of rows whose detail is open
const rowsByPath = new Map();      // path -> { tr, dt } row elements
let newestTime = null;             // server time of newest loaded entry (cursor)
let oldestTime = null;             // server time of oldest loaded entry (cursor)
let atEnd = false;                 // true once an older page returned < a full batch
let loadingOlder = false;          // guards concurrent infinite-scroll loads
const PAGE = 100;                  // entries fetched per infinite-scroll page
// PRELOAD_PX is how far below the viewport (in px) the next page starts
// loading. A generous margin keeps a tall buffer of rows ready so fast scrolls
// don't reach the bottom before the next page arrives. With an active filter,
// many rows are hidden, so the loader also keeps pulling pages until the buffer
// is full (see maybeLoadMore).
const PRELOAD_PX = 2000;
const inflightById = new Map();      // id -> tr

// filters holds the current client-side filter state. Filtering is done purely
// in the browser over already-loaded rows; the loader keeps fetching older
// pages so a narrow filter still fills the viewport.
const filters = { model: '', status: 'all', endpoint: 'all', timeRange: '1d' };
let atTimeEnd = false;             // true once loaded history is older than the time filter

// modelFilterActive is true when the model text box has enough input to filter.
function modelFilterActive() {
  return filters.model.trim().length >= 3;
}

// timeRangeCutoff returns the earliest timestamp (ms) included by the time filter,
// or null for "all time".
function timeRangeCutoff() {
  const day = 24 * 60 * 60 * 1000;
  switch (filters.timeRange) {
    case '1d': return Date.now() - day;
    case '7d': return Date.now() - 7 * day;
    case '30d': return Date.now() - 30 * day;
    default: return null;
  }
}

function entryInTimeRange(ts) {
  const cutoff = timeRangeCutoff();
  if (cutoff == null) return true;
  const t = Date.parse(ts);
  return Number.isFinite(t) && t >= cutoff;
}

function checkTimeEnd() {
  if (filters.timeRange === 'all') {
    atTimeEnd = false;
    return;
  }
  const cutoff = timeRangeCutoff();
  if (cutoff != null && oldestTime != null && Date.parse(oldestTime) < cutoff) {
    atTimeEnd = true;
  }
}

function filtersActive() {
  return modelFilterActive() || filters.status !== 'all' ||
    filters.endpoint !== 'all' || filters.timeRange !== 'all';
}

// entryMatches reports whether a log index entry passes the active filters.
function entryMatches(e) {
  if (!entryInTimeRange(e.time)) return false;
  if (filters.status === 'success' && !(e.status >= 200 && e.status < 300)) return false;
  if (filters.status === 'error' && (e.status >= 200 && e.status < 300)) return false;
  if (filters.endpoint !== 'all' && (e.endpoint || '') !== filters.endpoint) return false;
  return modelMatches((e.inbound_model || '') + ' ' + (e.served_by || ''));
}

// modelMatches applies the model text filter to a haystack string. The query
// supports comma-separated OR terms; fewer than 3 characters does not filter.
function modelMatches(hay) {
  const q = filters.model.trim().toLowerCase();
  if (!modelFilterActive()) return true;
  hay = hay.toLowerCase();
  return q.split(',').map(s => s.trim()).filter(Boolean).some(term => hay.includes(term));
}

function fmtElapsed(startedAt) {
  const ms = Date.now() - Date.parse(startedAt);
  if (!Number.isFinite(ms) || ms < 0) return '<span class="muted">—</span>';
  return esc((ms / 1000).toFixed(2)) + ' s';
}

function inflightServed(e) {
  if (e.current_target) return esc(e.current_target);
  return '<span class="muted">—</span>';
}

function inflightFinish(e) {
  if (!e.last_outcome) return '<span class="muted">—</span>';
  return `<span class="o-${esc(e.last_outcome)}">${esc(e.last_outcome)}</span>`;
}

function inflightPreview(e) {
  return e.request_preview
    ? `<td class="mono muted">${esc(e.request_preview)}</td>`
    : '<td></td>';
}

function inflightInTokens(e) {
  if (e.in_tokens == null || e.in_tokens === 0) return '<span class="muted">—</span>';
  return esc('~' + e.in_tokens);
}

function updateInflightRow(tr, e) {
  tr._entry = e; // retained so a later filter change can re-evaluate this row
  tr.innerHTML = `
    <td class="muted">${esc(fmtTime(e.started_at))}</td>
    <td><span class="pill active">active</span></td>
    <td>${esc(e.endpoint)}</td>
    <td class="mono">${esc(e.inbound_model)}</td>
    ${inflightPreview(e)}
    <td class="mono">${inflightServed(e)}</td>
    <td>${esc(e.attempts || 0)}</td>
    <td class="mono">${inflightInTokens(e)}</td>
    <td class="mono"><span class="muted">—</span></td>
    <td class="mono">${inflightFinish(e)}</td>
    <td class="muted" data-elapsed="${esc(e.started_at)}">${fmtElapsed(e.started_at)}</td>`;
}

function makeInflightRow(e) {
  const tr = document.createElement('tr');
  tr.className = 'inflight';
  tr.dataset.id = e.id;
  updateInflightRow(tr, e);
  return tr;
}

// inflightMatches applies the model and endpoint filters to an in-flight entry.
// The status filter is ignored for in-flight rows since they have no final
// status yet; current activity stays visible whenever its model/endpoint match.
function inflightMatches(e) {
  if (!entryInTimeRange(e.started_at)) return false;
  if (filters.endpoint !== 'all' && (e.endpoint || '') !== filters.endpoint) return false;
  return modelMatches((e.inbound_model || '') + ' ' + (e.current_target || ''));
}

function applyInflightRowFilter(tr, e) {
  tr.style.display = inflightMatches(e) ? '' : 'none';
}

function updateInflightCount(n) {
  if (!n) {
    inflightCountEl.style.display = 'none';
    inflightCountEl.textContent = '';
    return;
  }
  inflightCountEl.style.display = '';
  inflightCountEl.textContent = n + ' in flight';
}

function renderInflight(list) {
  const seen = new Set();
  const frag = document.createDocumentFragment();
  for (const e of list) {
    if (!e.id) continue;
    seen.add(e.id);
    registerEndpoint(e.endpoint);
    let tr = inflightById.get(e.id);
    if (!tr) {
      tr = makeInflightRow(e);
      inflightById.set(e.id, tr);
      frag.appendChild(tr);
    } else {
      updateInflightRow(tr, e);
    }
    applyInflightRowFilter(tr, e);
  }
  if (frag.firstChild) inflightRowsEl.insertBefore(frag, inflightRowsEl.firstChild);
  for (const [id, tr] of inflightById) {
    if (!seen.has(id)) {
      tr.remove();
      inflightById.delete(id);
    }
  }
  const ordered = list.filter(e => e.id && inflightById.has(e.id)).map(e => inflightById.get(e.id));
  for (const tr of ordered) inflightRowsEl.appendChild(tr);
  updateInflightCount(list.length);
}

async function refreshInflight() {
  try {
    const res = await fetch('/ui/inflight');
    const data = await res.json();
    renderInflight(data.requests || []);
  } catch (err) { /* transient; next tick retries */ }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(t) { try { return new Date(t).toLocaleString(); } catch { return t; } }
function pretty(v) {
  if (v == null || v === '') return '';
  try { return JSON.stringify(typeof v === 'string' ? JSON.parse(v) : v, null, 2); }
  catch { return typeof v === 'string' ? v : JSON.stringify(v); }
}

function failedAttemptOutcome(outcome) {
  return outcome === 'bad_output' || outcome === 'provider_error' ||
    outcome === 'error' || outcome === 'canceled' || outcome === 'prohibited_content';
}

function parseUsageBody(body) {
  if (body == null || body === '') return { in: null, out: null };
  try {
    if (typeof body === 'string') body = JSON.parse(body);
    if (body.usage) {
      const u = body.usage;
      if (u.prompt_tokens != null || u.completion_tokens != null) {
        return { in: u.prompt_tokens ?? null, out: u.completion_tokens ?? null };
      }
      if (u.input_tokens != null || u.output_tokens != null) {
        return { in: u.input_tokens ?? null, out: u.output_tokens ?? null };
      }
    }
    if (body.usageMetadata) {
      const m = body.usageMetadata;
      let out = m.candidatesTokenCount ?? null;
      if (out == null || out === 0) out = m.thoughtsTokenCount ?? null;
      if ((out == null || out === 0) && m.totalTokenCount != null && m.promptTokenCount != null) {
        const rest = m.totalTokenCount - m.promptTokenCount;
        if (rest > 0) out = rest;
      }
      return { in: m.promptTokenCount ?? null, out };
    }
  } catch { /* ignore */ }
  return { in: null, out: null };
}

function usageFromEntry(e) {
  if (e.prompt_tokens != null || e.completion_tokens != null) {
    return { in: e.prompt_tokens, out: e.completion_tokens };
  }
  if (e.success) {
    return parseUsageBody(e.response);
  }
  let prompt = null;
  let outSum = 0;
  let hasOut = false;
  for (const att of (e.attempts || [])) {
    if (!failedAttemptOutcome(att.outcome) || !att.response) continue;
    const u = parseUsageBody(att.response);
    if (u.in != null) prompt = prompt == null ? u.in : Math.max(prompt, u.in);
    if (u.out != null) {
      outSum += u.out;
      hasOut = true;
    }
  }
  const top = parseUsageBody(e.response);
  if (prompt == null && top.in != null) prompt = top.in;
  return { in: prompt, out: hasOut ? outSum : null };
}

function fmtTokens(n) {
  return n == null ? '<span class="muted">—</span>' : esc(String(n));
}

// fmtLatency renders a millisecond latency as seconds (e.g. "1.23 s").
function fmtLatency(ms) {
  const n = Number(ms);
  if (!Number.isFinite(n)) return '<span class="muted">—</span>';
  return esc((n / 1000).toFixed(2)) + ' s';
}

function attemptRow(a, entryKey, idx) {
  const head = `<div class="attempt">
    <span><span class="k">prov</span> ${esc(a.provider)}/${esc(a.model)}</span>
    <span><span class="k">key</span> <span class="mono">${esc(a.key)}</span> <span class="badge">${esc(a.key_type)}</span></span>
    <span><span class="k">http</span> ${esc(a.http_status)}</span>
    <span><span class="k">finish</span> ${esc(a.finish_reason || '-')}</span>
    <span><span class="k">latency</span> ${fmtLatency(a.latency_ms)}</span>
    <span class="o-${esc(a.outcome)}">${esc(a.outcome)}</span>
  </div>`;
  const err = a.error ? `<div class="muted mono" style="margin:-2px 0 6px;font-size:11px">${esc(a.error)}</div>` : '';
  const k = entryKey + '::att' + idx;
  const resp = a.response
    ? `<details class="attempt-resp" data-detailkey="${esc(k)}"><summary>failed response body</summary><pre class="nowrap" data-scrollkey="${esc(k)}">${esc(pretty(a.response))}</pre></details>`
    : '';
  return head + err + resp;
}

// detailInner builds the contents of an expanded row's detail cell from a full
// entry record (fetched lazily on expansion).
function detailInner(e, entryKey) {
  const u = usageFromEntry(e);
  const usageBar = `<div class="muted" style="margin-bottom:10px;font-size:12px">
    <span class="k">tokens</span> in ${fmtTokens(u.in)} · out ${fmtTokens(u.out)}
  </div>`;
  const attempts = (e.attempts || []).map((a, i) => attemptRow(a, entryKey, i)).join('') || '<span class="muted">none</span>';
  return `${usageBar}<div class="grid">
      <div class="card"><h3>Request</h3><pre class="nowrap" data-scrollkey="${esc(entryKey + '::req')}">${esc(pretty(e.request))}</pre></div>
      <div class="card"><h3>Response</h3><pre class="nowrap" data-scrollkey="${esc(entryKey + '::resp')}">${esc(pretty(e.response))}</pre></div>
    </div>
    <div class="attempts"><div class="card"><h3>Attempts (${(e.attempts||[]).length})</h3>${attempts}</div></div>`;
}

// detailCache holds full entry records keyed by path so an expanded row does
// not re-fetch on every refresh. Entries are append-only/immutable, so caching
// by path is safe. Rows are never re-rendered once created, so nested <details>
// and scroll positions inside a panel are preserved naturally.
const detailCache = new Map();

// fillDetail populates an expanded row's cell, fetching the full record once
// (by its index path) and caching it.
async function fillDetail(path, td) {
  if (detailCache.has(path)) {
    td.innerHTML = detailInner(detailCache.get(path), path);
    return;
  }
  if (td.dataset.loading) return;
  td.dataset.loading = '1';
  td.innerHTML = '<div class="muted" style="padding:10px">Loading…</div>';
  try {
    const res = await fetch('/ui/logs/entry?path=' + encodeURIComponent(path));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const full = await res.json();
    detailCache.set(path, full);
    td.innerHTML = detailInner(full, path);
  } catch (err) {
    td.innerHTML = '<div class="o-error" style="padding:10px">Failed to load detail: ' + esc(err) + '</div>';
  } finally {
    delete td.dataset.loading;
  }
}

function scroller() { return document.scrollingElement || document.documentElement; }

// visibleRowCount counts log rows currently shown (not hidden by a filter).
function visibleRowCount() {
  let n = 0;
  for (const r of rowsByPath.values()) if (r.tr.style.display !== 'none') n++;
  return n;
}

function updateEmpty() {
  if (rowsByPath.size === 0) {
    emptyEl.textContent = 'No log entries yet.';
    emptyEl.style.display = 'block';
    return;
  }
  if (visibleRowCount() === 0) {
    // Keep the loader pulling older pages; only declare "no matches" once the
    // whole history has been scanned for the current filter.
    if ((atEnd || atTimeEnd) && !loadingOlder) {
      emptyEl.textContent = 'No entries match the current filter.';
      emptyEl.style.display = 'block';
    } else {
      emptyEl.textContent = 'Searching older entries…';
      emptyEl.style.display = 'block';
    }
    return;
  }
  emptyEl.style.display = 'none';
}

// makeRow builds the list row plus its (hidden) detail row from one index entry.
function makeRow(e) {
  const path = e.path;
  const tr = document.createElement('tr');
  tr.className = 'row';
  const ok = e.status >= 200 && e.status < 300;
  const served = e.served_by ? esc(e.served_by) : '<span class="muted">—</span>';
  const preview = e.request_preview ? `<td class="mono muted">${esc(e.request_preview)}</td>` : '<td></td>';
  tr.innerHTML = `
    <td class="muted">${esc(fmtTime(e.time))}</td>
    <td><span class="pill ${ok ? 'ok' : 'err'}">${esc(e.status)}</span></td>
    <td>${esc(e.endpoint)}</td>
    <td class="mono">${esc(e.inbound_model)}</td>
    ${preview}
    <td class="mono">${served}</td>
    <td>${esc(e.attempts)}</td>
    <td class="mono">${fmtTokens(e.in_tokens)}</td>
    <td class="mono">${fmtTokens(e.out_tokens)}</td>
    <td class="mono">${e.finish_reason ? esc(e.finish_reason) : '<span class="muted">—</span>'}</td>
    <td class="muted">${fmtLatency(e.latency_ms)}</td>`;
  const dt = document.createElement('tr');
  dt.className = 'detail';
  const td = document.createElement('td');
  td.colSpan = 11;
  dt.appendChild(td);
  dt.style.display = 'none';
  tr.addEventListener('click', () => {
    if (dt.style.display === 'none') {
      dt.style.display = 'table-row';
      expanded.add(path);
      fillDetail(path, td);
    } else {
      dt.style.display = 'none';
      expanded.delete(path);
    }
  });
  return { tr, dt, entry: e };
}

// applyRowFilter shows or hides a log row (and its detail) per the active
// filters, restoring an expanded detail only when its row is visible.
function applyRowFilter(r) {
  const show = entryMatches(r.entry);
  r.tr.style.display = show ? '' : 'none';
  r.dt.style.display = (show && expanded.has(r.entry.path)) ? 'table-row' : 'none';
}

// addEntries inserts a batch of index entries (server-ordered newest first),
// skipping any already present, and advances the time cursors. `where` is
// 'top' for newer entries (auto-refresh) or 'bottom' for older ones (initial
// load and infinite scroll).
function addEntries(list, where) {
  const frag = document.createDocumentFragment();
  let added = 0;
  for (const e of list) {
    if (!e.path || rowsByPath.has(e.path)) continue;
    const r = makeRow(e);
    rowsByPath.set(e.path, r);
    registerEndpoint(e.endpoint);
    applyRowFilter(r);
    frag.appendChild(r.tr);
    frag.appendChild(r.dt);
    added++;
    if (newestTime == null || Date.parse(e.time) > Date.parse(newestTime)) newestTime = e.time;
    if (oldestTime == null || Date.parse(e.time) < Date.parse(oldestTime)) oldestTime = e.time;
  }
  if (added) {
    if (where === 'top') rowsEl.insertBefore(frag, rowsEl.firstChild);
    else rowsEl.appendChild(frag);
    updateEmpty();
  }
  return added;
}

// loadInitial fetches the cached recent entries shown on first open.
async function loadInitial() {
  try {
    const [logsRes] = await Promise.all([
      fetch('/ui/logs'),
      refreshInflight(),
    ]);
    const data = await logsRes.json();
    addEntries(data.entries || [], 'bottom');
    applyFilters();
  } catch (err) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = 'Failed to load logs: ' + err;
  }
}

// refresh pulls entries newer than the newest one we hold and prepends them.
// It keeps the user anchored: if they are at the very top, new rows appear and
// stay at the top; otherwise the viewport is offset by the inserted height so
// the row they are reading (e.g. an expanded log) does not jump.
async function refresh() {
  const url = newestTime ? '/ui/logs?since=' + encodeURIComponent(newestTime) : '/ui/logs';
  try {
    const [res] = await Promise.all([
      fetch(url),
      refreshInflight(),
    ]);
    const data = await res.json();
    const list = data.entries || [];
    if (!list.length) return;
    const se = scroller();
    const prevTop = se.scrollTop;
    const prevHeight = se.scrollHeight;
    const atTop = prevTop <= 4;
    const added = addEntries(list, 'top');
    if (!added) return;
    se.scrollTop = atTop ? 0 : prevTop + (se.scrollHeight - prevHeight);
  } catch (err) { /* transient; next tick retries */ }
}

// loadOlder fetches the next page of entries older than the oldest we hold and
// appends them to the bottom (infinite scroll).
async function loadOlder() {
  if (loadingOlder || atEnd || !oldestTime) return;
  loadingOlder = true;
  try {
    const res = await fetch('/ui/logs?before=' + encodeURIComponent(oldestTime) + '&limit=' + PAGE);
    const data = await res.json();
    const list = data.entries || [];
    addEntries(list, 'bottom');
    if (list.length < PAGE) atEnd = true;
  } catch (err) { /* transient; another scroll retries */ }
  finally {
    loadingOlder = false;
    checkTimeEnd();
    maybeLoadMore();
  }
}

// maybeLoadMore loads another older page when the buffered content below the
// viewport falls under PRELOAD_PX. It also keeps loading while a filter hides
// most rows (so a narrow filter still fills the screen) and until the page is
// tall enough to scroll at all.
function maybeLoadMore() {
  if (atEnd || atTimeEnd || loadingOlder) return;
  const se = scroller();
  const below = se.scrollHeight - se.scrollTop - se.clientHeight;
  const filtering = filtersActive();
  // When filtering, the visible buffer can be tiny even with many rows loaded,
  // so keep paging until either the buffer is full or the history is exhausted.
  if (below < PRELOAD_PX || (filtering && se.scrollHeight <= se.clientHeight)) loadOlder();
}

window.addEventListener('scroll', maybeLoadMore, { passive: true });

// setAuto turns the auto-refresh interval on or off and reflects the state with
// a glowing Refresh button.
function setAuto(on) {
  autoOn = on;
  refreshBtn.classList.toggle('glow', on);
  refreshBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (timer) { clearInterval(timer); timer = null; }
  if (on) timer = setInterval(refresh, 3000);
  else updateInflightElapsed();
}

function updateInflightElapsed() {
  for (const tr of inflightById.values()) {
    const td = tr.querySelector('[data-elapsed]');
    if (td) td.innerHTML = fmtElapsed(td.dataset.elapsed);
  }
}

// The single Refresh button is both an action and a toggle: a short click
// refreshes now, while a press-and-hold flips auto-refresh on/off. A hold timer
// distinguishes the two so a hold does not also fire an immediate refresh.
const refreshBtn = document.getElementById('refresh');
const HOLD_MS = 450;
let holdTimer = null;
let held = false;

refreshBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  held = false;
  try { refreshBtn.setPointerCapture(e.pointerId); } catch (_) {}
  holdTimer = setTimeout(() => {
    held = true;
    holdTimer = null;
    setAuto(!autoOn);
  }, HOLD_MS);
});
function cancelHold() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
}
refreshBtn.addEventListener('pointerup', () => {
  cancelHold();
  if (!held) refresh(); // short press => refresh immediately
});
refreshBtn.addEventListener('pointercancel', cancelHold);
refreshBtn.addEventListener('contextmenu', (e) => e.preventDefault()); // no menu on long-press

// --- Client-side filtering -------------------------------------------------
const fModel = document.getElementById('f-model');
const fTime = document.getElementById('f-time');
const fStatus = document.getElementById('f-status');
const fEndpoint = document.getElementById('f-endpoint');
const fClear = document.getElementById('f-clear');
const MODEL_FILTER_DEBOUNCE_MS = 2000;
const knownEndpoints = new Set();

// registerEndpoint adds any newly seen endpoint to the endpoint filter dropdown
// so the options grow as logs stream in, without disturbing the selection.
function registerEndpoint(ep) {
  if (!ep || knownEndpoints.has(ep)) return;
  knownEndpoints.add(ep);
  const opts = [...knownEndpoints].sort();
  const cur = fEndpoint.value;
  fEndpoint.innerHTML = '<option value="all">All endpoints</option>' +
    opts.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');
  fEndpoint.value = cur;
}

// applyFilters re-evaluates every loaded row against the current filters, then
// nudges the loader so a narrow filter keeps pulling older pages to fill the
// viewport.
function applyFilters() {
  for (const r of rowsByPath.values()) applyRowFilter(r);
  for (const tr of inflightById.values()) {
    if (tr._entry) applyInflightRowFilter(tr, tr._entry);
  }
  checkTimeEnd();
  updateEmpty();
  maybeLoadMore();
}

let modelFilterTimer = null;
function onFilterChange() {
  filters.model = fModel.value;
  filters.status = fStatus.value;
  filters.endpoint = fEndpoint.value;
  filters.timeRange = fTime.value;
  atTimeEnd = false;
  applyFilters();
}
fModel.addEventListener('input', () => {
  clearTimeout(modelFilterTimer);
  modelFilterTimer = setTimeout(onFilterChange, MODEL_FILTER_DEBOUNCE_MS);
});
fTime.addEventListener('change', onFilterChange);
fStatus.addEventListener('change', onFilterChange);
fEndpoint.addEventListener('change', onFilterChange);
fClear.addEventListener('click', () => {
  clearTimeout(modelFilterTimer);
  modelFilterTimer = null;
  fModel.value = '';
  fTime.value = '1d';
  fStatus.value = 'all';
  fEndpoint.value = 'all';
  onFilterChange();
  fModel.focus();
});

loadInitial();
setAuto(true); // auto-refresh on by default
</script>
</body>
</html>
